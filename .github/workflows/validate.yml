name: Validate

on:
  pull_request:
  push:
    branches:
      - main

# A new push to the same ref supersedes older runs instead of queueing them.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format, analyze and a publish dry run: everything that does not need a
  # specific host platform.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Always the latest stable Flutter release: the package supports it
      # without a pinned version, the same as the apps that depend on it.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Every package, not only the root: `flutter analyze .` walks into
      # `example`, `tool/cli` and `tool/public_api`, and a package without
      # `pub get` is not analyzed properly.
      - name: Install dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)
          (cd tool/cli && dart pub get)
          (cd tool/public_api && dart pub get)

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze .

      # Every type of this package that a public signature uses (constructor
      # parameters, fields, methods, supertypes, typedefs) must be exported
      # from `lib/impaktfull_ui.dart`, or apps can not name it.
      - name: Public API exports
        run: dart run tool/public_api/bin/check_public_api.dart

      # `lib/fix_data.yaml` lets apps migrate off deprecated APIs with
      # `dart fix --apply`. This applies those fixes to `test_fixes/*.dart`
      # and fails if the result differs from the `.dart.expect` golden.
      - name: dart fix migrations
        working-directory: test_fixes
        run: dart fix --compare-to-golden

      - name: Publish dry run
        run: flutter pub publish --dry-run

  # macOS, because the golden tests are configured for `HostPlatform.macOS`
  # (`test/util/golden_test_util.dart`): on any other host those goldens are
  # skipped and a visual regression would pass unnoticed.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Test
        run: flutter test --coverage

      # Prints the line coverage of `lib/` per directory and fails when the
      # total drops below the minimum. The minimum only goes up: raise it when
      # a pull request adds tests (see AGENTS.md).
      - name: Coverage
        run: dart run tool/coverage/bin/coverage_summary.dart --min 88.2

  # The component library is deployed to GitHub Pages from `main`. Building it
  # here means a pull request that breaks the example fails before it is
  # merged, instead of on the deploy.
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web
        run: flutter build web

      # dart2wasm rejects code that dart2js accepts (dart:html, package:js,
      # conditional imports on dart.library.html), so Wasm is built separately.
      - name: Build web (Wasm)
        run: flutter build web --wasm

  # The tests in Chrome, compiled to JS and to Wasm, to prove that every
  # component works on the web. Golden tests (alchemist does not compile for
  # the web) and `@TestOn('vm')` files are left out by tool/test_web.sh;
  # test/src/test_platform_test.dart makes sure nothing else needs the VM.
  test_web:
    # JS and Wasm in parallel: each takes a few minutes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: js
            args: ""
          - compiler: wasm
            args: --wasm
    name: test_web (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Test in Chrome (${{ matrix.compiler }})
        run: ./tool/test_web.sh ${{ matrix.args }}

  # Builds the example for every platform that needs a native build, to catch
  # a dependency (plugin) or a native project setting (deployment target,
  # CMake, Gradle) that breaks the build of one of them. Together with the web
  # builds in `example`, every platform the package supports is built on each
  # pull request. iOS is built for a device without code signing, so no
  # certificates are needed.
  example_platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            build: flutter build apk --debug
          - platform: linux
            os: ubuntu-latest
            build: flutter build linux --debug
          - platform: ios
            os: macos-latest
            build: flutter build ios --debug --no-codesign
          - platform: macos
            os: macos-latest
            build: flutter build macos --debug
          - platform: windows
            os: windows-latest
            build: flutter build windows --debug
    name: example (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # bash on every runner, also on Windows (PowerShell by default), so the
    # steps below are the same everywhere.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 17

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build
        working-directory: example
        run: |
          flutter pub get
          ${{ matrix.build }}

  # pana is the tool that scores packages on pub.dev. Fails when it does not
  # list every platform (and Wasm) as supported, or when the platform support
  # score is not full, e.g. because lib/ imports dart:io without a
  # conditional import.
  pana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install pana
        run: dart pub global activate pana

      - name: Run pana
        run: |
          dart pub global run pana --no-warning --json \
            --flutter-sdk "$(dirname "$(dirname "$(which flutter)")")" . > pana.json

      - name: Check platform support
        run: |
          jq -r '.report.sections[] | select(.id == "platform") | .summary' pana.json
          missing=0
          for tag in platform:android platform:ios platform:macos platform:windows platform:linux platform:web is:wasm-ready; do
            if ! jq -e --arg tag "$tag" '.tags | index($tag)' pana.json > /dev/null; then
              echo "::error::pana does not report $tag"
              missing=1
            fi
          done
          granted=$(jq '.report.sections[] | select(.id == "platform") | .grantedPoints' pana.json)
          max=$(jq '.report.sections[] | select(.id == "platform") | .maxPoints' pana.json)
          echo "Platform support: $granted / $max"
          if [ "$granted" != "$max" ]; then
            echo "::error::pana platform support is $granted / $max"
            missing=1
          fi
          exit $missing
