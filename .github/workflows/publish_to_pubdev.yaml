name: Publish to pub.dev

# Triggered by the tag release-please pushes when its release PR is merged.
# pub.dev is configured to accept tags matching `v{{version}}` from the
# `pub.dev` environment; both must stay in sync with that setting.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    name: Publish to pub.dev
    environment: pub.dev
    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Exchanges the GitHub OIDC token for a pub.dev token; `flutter pub
      # publish` below uses it. dart-lang's reusable publish workflow cannot be
      # used for a Flutter package, it only has the Dart SDK.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Publish (dry run)
        run: flutter pub publish --dry-run
      - name: Publish
        run: flutter pub publish --force
