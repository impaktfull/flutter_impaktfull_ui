name: Publish to github pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Merging several pull requests in a row
# otherwise starts overlapping deployments, and GitHub rejects a deployment
# while another one is in progress. Queued runs in between are skipped, so
# the latest `main` is always the one that gets deployed. A running deploy is
# never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/checkout@v4
      # Same Flutter version as `validate.yml` and local development.
      - name: Read Flutter version
        id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      # Analyze and tests run in `validate.yml`; this workflow only deploys.
      - run: flutter pub get
        working-directory: ./example
      - run: flutter build web
        working-directory: ./example
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: "./example/build/web"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
