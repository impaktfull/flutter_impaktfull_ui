name: impaktfull_ui_example
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  impaktfull_ui:
    path: ../
  phosphor_flutter: ^2.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
# Temporary override: phosphor_flutter 2.1.0 (latest published) extends IconData,
# which became a `final class` in recent Flutter, breaking the build.
# Pinned to phosphor-icons/flutter PR #62 (fix!: support Flutter 3.43+ IconData
# final-class change). Remove once the fix is published to pub.dev.
dependency_overrides:
  phosphor_flutter:
    git:
      url: https://github.com/subarnaPdl/phosphor_icons.git
      ref: 514f0a883571c4453dbd6ee3041d1dcba4fb8fc7

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/ubuntu/
    - assets/fonts/geologica/
    - assets/images/
    - assets/images/supporting/
    - assets/images/supporting/avatars/
    - assets/images/supporting/gallery/
    - assets/lottie/
    - assets/rive/
  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/ubuntu/ubuntu_light.ttf
          weight: 300
        - asset: assets/fonts/ubuntu/ubuntu_regular.ttf
        - asset: assets/fonts/ubuntu/ubuntu_medium.ttf
          weight: 500
        - asset: assets/fonts/ubuntu/ubuntu_medium.ttf
          weight: 600
        - asset: assets/fonts/ubuntu/ubuntu_bold.ttf
          weight: 700
    - family: Geologica
      fonts:
        - asset: assets/fonts/geologica/geologica_light.ttf
          weight: 300
        - asset: assets/fonts/geologica/geologica_regular.ttf
        - asset: assets/fonts/geologica/geologica_medium.ttf
          weight: 500
        - asset: assets/fonts/geologica/geologica_semibold.ttf
          weight: 600
        - asset: assets/fonts/geologica/geologica_bold.ttf
          weight: 700

impaktfull_ui_figma_sync:
